//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.


// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'
apply plugin: 'org.jetbrains.kotlin.android'

// Added for Sloth (https://github.com/Dairy-Foundation/Sloth#load-plugin)
buildscript {
    repositories {
        mavenCentral()
        maven {
            url "https://repo.dairy.foundation/releases"
        }
    }
    dependencies {
        classpath "dev.frozenmilk:Load:0.2.4"
    }
}

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

repositories {
    maven {
        url = "https://repo.dairy.foundation/releases" // Added for AdvantageScope Lite and Sloth
    }
    maven {
        url = 'https://maven.brott.dev/' // Added for Road Runner
    }
    maven { url = 'https://maven.pedropathing.com' } // Added for Pedro Pathing
    maven { url = "https://mymaven.bylazar.com/releases" } // Added for Panels dashboard
}

dependencies {
    implementation project(':FtcRobotController')
    implementation 'androidx.core:core-ktx:1.3.2'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

    implementation("dev.frozenmilk.sinister:Sloth:0.2.4") // Add Sloth (https://github.com/Dairy-Foundation/Sloth)
    implementation("com.acmerobotics.slothboard:dashboard:0.2.4+0.4.17") // Version of FTC Dashboard compatible with Sloth

    implementation("page.j5155.AdvantageScope:lite:v26.0.0") // Add AdvantageScope Lite (https://github.com/j5155/AdvantageScope-Lite-FTC#installation)

    implementation('org.psilynx.psikit:core:0.1.0-beta1') // Add PsiKit (port of AdvantageKit for FTC)
    implementation('org.psilynx.psikit:ftc:0.1.0-beta1')  // Add PsiKit (port of AdvantageKit for FTC)

    implementation('dev.nextftc:ftc:1.0.0')      // Add NextFTC (https://nextftc.dev/)
    implementation('dev.nextftc:hardware:1.0.0') // Add NextFTC hardware module (https://nextftc.dev/)
    implementation('dev.nextftc:control:1.0.0')  // Add NextControl (https://nextftc.dev/control/)
    implementation('dev.nextftc:bindings:1.0.1') // Add NextBindings (https://nextftc.dev/bindings)

    // Add Road Runner (https://rr.brott.dev/docs/v1-0/installation/)
    // `exclude` lines required to work with Sloth version of FTC Dashboard, see https://github.com/Dairy-Foundation/Sloth#ftc-dashboard
    implementation("com.acmerobotics.roadrunner:ftc:0.1.25") {
        exclude group: "com.acmerobotics.dashboard"
    }
    implementation("com.acmerobotics.roadrunner:core:1.0.1") {
        exclude group: "com.acmerobotics.dashboard"
    }
    implementation("com.acmerobotics.roadrunner:actions:1.0.1") {
        exclude group: "com.acmerobotics.dashboard"
    }

    // Add Pedro Pathing (https://pedropathing.com/)
    implementation 'com.pedropathing:ftc:2.0.1'
    implementation 'com.pedropathing:telemetry:0.0.6'

    // Add Panels dashboard as recommended/used by Pedro Pathing (https://panels.bylazar.com/)
    implementation 'com.bylazar:fullpanels:1.0.2'
}
